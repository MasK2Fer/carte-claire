<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1D6A51">
<title>Notre carte · Carte Claire</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
</head>
<body style="padding-bottom:24px">
<main class="client-page">
  <div class="phone" id="carte" aria-live="polite"></div>
  <p class="foot">Carte des allergènes réalisée avec Carte Claire · maquette</p>
</main>
<script src="commun.js"></script>
<script>
(function () {
  "use strict";
  var data = CC.lireCarte() || CC.EXEMPLE;
  var lang = data.lang || "fr";
  try { var nav = (navigator.language || "").slice(0, 2).toLowerCase(); if (CC.LANGS.indexOf(nav) >= 0) lang = nav; } catch (e) {}
  var sel = []; // reste en mémoire : jamais enregistré
  var box = document.getElementById("carte");
  function render(focusId) {
    document.documentElement.lang = lang;
    box.setAttribute("lang", lang);
    box.innerHTML = CC.carteHTML(data, lang, sel);
    if (focusId) { var el = document.getElementById(focusId); if (el) el.focus(); }
  }
  box.addEventListener("click", function (e) {
    var b = e.target.closest('[data-act="lang"]'); if (!b) return;
    lang = b.dataset.lang; render();
  });
  box.addEventListener("change", function (e) {
    var el = e.target; if (el.dataset.act !== "pick") return;
    var i = sel.indexOf(el.value);
    if (el.checked && i < 0) sel.push(el.value); if (!el.checked && i >= 0) sel.splice(i, 1);
    render(el.id);
  });
  render();
})();
</script>
</body>
</html>
