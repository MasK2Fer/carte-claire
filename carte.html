<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7F6F2">
<title>Notre carte · Carte Claire</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
</head>
<body style="padding-bottom:24px">
<main class="client-page">
  <div class="phone" id="carte" aria-live="polite"></div>
  <p class="foot">Carte des allergènes réalisée avec Carte Claire · maquette</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="commun.js"></script>
<script>
(function () {
  "use strict";
  var data = null, lang = "fr";
  var nav = "";
  try { nav = (navigator.language || "").slice(0, 2).toLowerCase(); } catch (e) {}
  var sel = []; // reste en mémoire : jamais enregistré
  var box = document.getElementById("carte");
  function demarrer(d) {
    data = d;
    lang = CC.LANGS.indexOf(nav) >= 0 ? nav : (data.lang || "fr");
    if (data.resto) document.title = data.resto + " · Notre carte";
    render();
  }
  function message(txt) { box.innerHTML = '<p class="notice" style="padding:24px 8px">' + CC.esc(txt) + "</p>"; }
  function render(focusId) {
    document.documentElement.lang = lang;
    box.setAttribute("lang", lang);
    box.innerHTML = CC.carteHTML(data, lang, sel);
    if (focusId) { var el = document.getElementById(focusId); if (el) el.focus(); }
  }
  box.addEventListener("click", function (e) {
    var b = e.target.closest('[data-act="lang"]'); if (!b) return;
    lang = b.dataset.lang; render();
  });
  box.addEventListener("change", function (e) {
    var el = e.target; if (el.dataset.act !== "pick") return;
    var i = sel.indexOf(el.value);
    if (el.checked && i < 0) sel.push(el.value); if (!el.checked && i >= 0) sel.splice(i, 1);
    render(el.id);
  });

  // Adresse du QR code : carte.html?r=<code du restaurant>. Sans code, carte de démonstration.
  var slug = "";
  try { slug = (new URLSearchParams(location.search).get("r") || "").trim().toLowerCase(); } catch (e) {}
  if (slug && CC.cloud) {
    message("Chargement de la carte…");
    CC.chargerCartePublique(slug).then(function (d) {
      if (d && d.plats) demarrer(d); else message("Cette carte n'existe pas ou n'est plus en ligne. Demandez la carte au personnel.");
    }).catch(function () { message("La carte n'a pas pu être chargée. Vérifiez votre connexion ou demandez la carte au personnel."); });
  } else {
    demarrer(CC.lireCarte() || CC.EXEMPLE);
  }
})();
</script>
</body>
</html>
