<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1D6A51">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

<title>Carte Claire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Mise en page : appli mobile à onglets du bas, colonne de 760 px max, fiches comme des fiches techniques de cuisine */
:root {
  --bg: #F2F4F2;
  --surface: #FFFFFF;
  --sunk: #E8ECE9;
  --ink: #18211D;
  --muted: #5B6862;
  --line: #D6DDD9;
  --accent: #1D6A51;
  --accent-soft: #DCEDE5;
  --accent-ink: #FFFFFF;
  --danger: #B3261E;
  --danger-soft: #F8E1DF;
  --warn: #9A5B06;
  --warn-soft: #FBEBD2;
  --ok: #24724A;
  --ok-soft: #DDF0E4;
  --shadow: 0 1px 2px rgba(20, 30, 25, .06), 0 4px 16px rgba(20, 30, 25, .06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #182019; --sunk: #1F2924; --ink: #E6ECE8; --muted: #9AA8A1; --line: #2B3631;
    --accent: #56B691; --accent-soft: #1E3A2F; --accent-ink: #0B1310;
    --danger: #F0857B; --danger-soft: #3A1E1C; --warn: #E6A84E; --warn-soft: #3A2A12; --ok: #73C795; --ok-soft: #1B3326;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #182019; --sunk: #1F2924; --ink: #E6ECE8; --muted: #9AA8A1; --line: #2B3631;
  --accent: #56B691; --accent-soft: #1E3A2F; --accent-ink: #0B1310;
  --danger: #F0857B; --danger-soft: #3A1E1C; --warn: #E6A84E; --warn-soft: #3A2A12; --ok: #73C795; --ok-soft: #1B3326;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h2 { font-size: 26px; line-height: 1.1; }
h3 { font-size: 20px; line-height: 1.15; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; font-size: 13px; color: var(--muted); }

/* En-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 8px; display: flex; align-items: center; gap: 12px; justify-content: space-between; border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand .app { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.top input.resto { font: 600 20px/1.2 var(--f-body); color: var(--ink); background: transparent; border: 1px dashed transparent; border-radius: 6px; padding: 2px 4px; margin-left: -4px; min-width: 0; width: 100%; }
.top input.resto:hover, .top input.resto:focus { border-color: var(--line); outline: none; }
.demo-tag { flex: none; font: 600 12px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); padding: 6px 8px; border-radius: 4px; }
.intro { font-size: 14px; color: var(--muted); }

/* Onglets du bas */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tab { appearance: none; border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 8px; font: 600 14px/1.1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }
.tab:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Boutons */
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 15px/1 var(--f-body); padding: 11px 14px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 6px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > * { min-width: 0; }

/* Cartes recette */
.list { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.recipe { cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.recipe:hover { border-color: var(--accent); }
.recipe-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.recipe-head h3 { min-width: 0; }
.price { font-family: var(--f-num); font-size: 15px; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 13px/1 var(--f-body); padding: 5px 8px; border-radius: 999px; background: var(--danger-soft); color: var(--danger); white-space: nowrap; }
.chip.trace { background: var(--warn-soft); color: var(--warn); }
.chip.none { background: var(--ok-soft); color: var(--ok); }
.chip.check { background: var(--sunk); color: var(--muted); }
.pill { font: 600 13px/1 var(--f-num); padding: 5px 8px; border-radius: 4px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--danger-soft); color: var(--danger); }
.meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 14px; color: var(--muted); }

/* Tableau allergènes */
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table.matrix { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.matrix th, .matrix td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: center; }
.matrix thead th { font: 600 12px/1.15 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); vertical-align: bottom; min-width: 58px; }
.matrix th.dish { text-align: left; position: sticky; left: 0; background: var(--surface); min-width: 150px; max-width: 190px; font: 600 15px/1.25 var(--f-body); text-transform: none; letter-spacing: 0; color: var(--ink); border-right: 1px solid var(--line); }
.matrix thead th.dish { font: 600 12px/1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.mark { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font: 700 13px/1 var(--f-body); }
.mark.c { background: var(--danger); color: var(--surface); }
.mark.t { border: 2px solid var(--warn); color: var(--warn); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* Carte client */
.phone { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; max-width: 430px; width: 100%; }
.client-layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 720px) { .client-layout { grid-template-columns: minmax(0, 1fr) 220px; align-items: start; } }
.langs { display: flex; gap: 6px; }
.lang { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 14px/1 var(--f-display); letter-spacing: .08em; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.lang[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.allergen-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.toggle { position: relative; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle span { display: inline-block; font: 600 14px/1 var(--f-body); padding: 8px 10px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
.toggle input:checked + span { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.dish { padding-block: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.dish:first-child { border-top: 0; }
.dish-name { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
.note { font-size: 14px; }
.note.warn { color: var(--warn); }
.note.ok { color: var(--ok); }
.note.bad { color: var(--danger); }
.notice { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.qr-box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
#qr { background: #FFFFFF; padding: 10px; border-radius: 6px; line-height: 0; }
#qr img, #qr canvas { width: 160px; height: 160px; }
details summary { cursor: pointer; font-weight: 600; color: var(--muted); padding-block: 6px; }

/* Marges */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.kpi b { font: 600 22px/1.1 var(--f-num); }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.bar { grid-column: 1 / -1; height: 8px; background: var(--sunk); border-radius: 4px; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--ok); }
.bar i.over { background: var(--danger); }
.bar .target { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.alert { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.alert.okay { background: var(--ok-soft); color: var(--ok); }
.ing-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.ing-table td, .ing-table th { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.ing-table th { font: 600 12px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ing-table td.r, .ing-table th.r { text-align: right; }
.price-input { width: 84px; text-align: right; }
input[type="text"], input[type="number"], select, textarea {
  font: 400 16px/1.3 var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0;
}
input[type="number"] { font-family: var(--f-num); }
textarea { resize: vertical; min-height: 60px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; }
.target-input { width: 80px; }

/* Feuille d'édition */
.sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgba(10, 16, 13, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 760px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow-y: auto; border-radius: 16px 16px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.line-row { display: grid; grid-template-columns: minmax(0, 1fr) 92px auto; gap: 6px; align-items: center; }
.line-row .unit { font-size: 13px; color: var(--muted); }
.icon-btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted); width: 40px; height: 40px; border-radius: 8px; cursor: pointer; font: 600 18px/1 var(--f-body); }
.check-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.check-grid .toggle input:checked + span { background: var(--warn); border-color: var(--warn); }
.live { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.badge-src { font-size: 12px; color: var(--warn); }
.confirm { background: var(--surface); border: 1px solid var(--danger); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 8px; font-weight: 600; max-width: calc(100% - 32px); }
.inv-line { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding-block: 8px; border-bottom: 1px solid var(--line); }
@media (max-width: 420px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .kpi b { font-size: 18px; } h2 { font-size: 24px; } }
@media (prefers-reduced-motion: no-preference) { .recipe, .btn, .tab { transition: border-color .15s, background-color .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="app">Carte Claire</span>
      <input id="resto" class="resto" type="text" aria-label="Nom du restaurant" value="">
    </div>
    <span class="demo-tag">Maquette</span>
  </header>
  <p class="intro">Données d'exemple pour tester l'idée. Tout ce que tu saisis reste dans ce navigateur et n'est envoyé nulle part.</p>
  <main id="view" class="wrap" aria-live="polite"></main>
</div>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" id="tab-recettes" data-tab="recettes" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Recettes</button>
  <button class="tab" role="tab" id="tab-allergenes" data-tab="allergenes" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/></svg>Allergènes</button>
  <button class="tab" role="tab" id="tab-carte" data-tab="carte" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/></svg>Carte client</button>
  <button class="tab" role="tab" id="tab-marges" data-tab="marges" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Marges</button>
</nav>

<div id="sheet-root"></div>
<div id="toast-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  function eur(n) { return n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €"; }

    document.getElementById("toast-root").innerHTML = "";
    var r = id ? state.recettes.filter(function (x) { return x.id === id; })[0] : null;
    draft = r ? JSON.parse(JSON.stringify(r)) : { id: "r" + Date.now(), nom: "", noms: {}, prix: 12, lignes: [], traces: [], tracesNote: "", variante: { fr: "", en: "", de: "", it: "", retire: [] }, statut: "ok", _new: true };
    draftConfirmDelete = false;
    renderSheet();
  }
  function closeEditor() { draft = null; document.getElementById("sheet-root").innerHTML = ""; }
  function renderSheet() {
    if (!draft) return;
    var r = draft, c = contient(r), t = traces(r), rr = ratio(r), over = rr > state.cible / 100;
    var opts = state.ingredients.slice().sort(function (a, b) { return a.nom.localeCompare(b.nom, "fr"); });
    var h = '<div class="sheet-bg" data-act="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">';
    h += '<div class="sheet-head"><h2 id="sheet-title">' + (r._new ? "Nouvelle recette" : "Fiche recette") + '</h2><button class="icon-btn" data-act="close" aria-label="Fermer">×</button></div>';
    if (r.statut === "a_verifier") h += '<div class="alert" style="background:var(--warn-soft);color:var(--warn)"><b>Pré-remplie depuis la photo : vérifie les ingrédients et les quantités.</b></div>';
    h += '<div class="grid2"><div class="field"><label class="label" for="f-nom">Nom du plat</label><input id="f-nom" type="text" data-f="nom" value="' + esc(r.nom) + '" placeholder="Ex. Salade de chèvre chaud"></div>' +
         '<div class="field"><label class="label" for="f-prix">Prix TTC (€)</label><input id="f-prix" type="number" min="0" step="0.5" data-f="prix" value="' + r.prix + '"></div></div>';

    h += '<div class="field"><span class="label">Ingrédients par portion</span>';
    r.lignes.forEach(function (l, i) {
      var g = ing(l.ing); if (!g) return;
      var shown = bigUnit(g.unite) ? Math.round(l.q * 1000 * 10) / 10 : l.q;
      h += '<div class="line-row"><span>' + esc(g.nom) + (g.al.length ? ' <span class="small" style="color:var(--danger)">· ' + esc(g.al.map(function (x) { return A[x].fr; }).join(", ")) + "</span>" : "") + (g.src ? ' <span class="badge-src">(' + esc(g.src) + ")</span>" : "") + "</span>" +
           '<span class="row" style="flex-wrap:nowrap;gap:4px"><input type="number" min="0" step="any" id="q-' + i + '" data-act="q" data-i="' + i + '" value="' + shown + '" aria-label="Quantité de ' + esc(g.nom) + '"><span class="unit">' + esc(smallUnit(g.unite)) + "</span></span>" +
           '<button class="icon-btn" data-act="del-line" data-i="' + i + '" aria-label="Retirer ' + esc(g.nom) + '">−</button></div>';
    });
    h += '<div class="row"><select id="add-ing" aria-label="Ajouter un ingrédient"><option value="">+ Ajouter un ingrédient…</option>';
    opts.forEach(function (g) { h += '<option value="' + esc(g.id) + '">' + esc(g.nom) + "</option>"; });
    h += '</select><button class="btn" data-act="scan">Scanner un code-barres</button></div>';
    h += '<p class="small muted">Le scan est simulé : il ajoute un produit d\'exemple dont les allergènes viendraient d\'Open Food Facts, à confirmer.</p></div>';

    h += '<div class="field"><span class="label">Risques de contamination croisée</span><div class="check-grid">';
    ALLERGENES.forEach(function (a) {
      if (c.indexOf(a.c) >= 0) return;
      h += '<label class="toggle"><input type="checkbox" id="tr-' + a.c + '" data-act="trace" value="' + a.c + '"' + (r.traces.indexOf(a.c) >= 0 ? " checked" : "") + "><span>" + esc(a.fr) + "</span></label>";
    });
    h += '</div><input type="text" id="f-tracesNote" data-f="tracesNote" value="' + esc(r.tracesNote || "") + '" placeholder="Pourquoi ? Ex. friteuse commune, même plan de travail"></div>';

    h += '<div class="field"><span class="label">Variante possible sur demande</span><input type="text" id="f-variante" data-f="variante" value="' + esc(r.variante.fr || "") + '" placeholder="Ex. sans sauce"><div class="check-grid">';
    c.forEach(function (x) { h += '<label class="toggle"><input type="checkbox" id="vr-' + x + '" data-act="vretire" value="' + x + '"' + (r.variante.retire.indexOf(x) >= 0 ? " checked" : "") + "><span>Retire : " + esc(A[x].fr) + "</span></label>"; });
    if (!c.length) h += '<span class="small muted">Aucun allergène à retirer.</span>';
    h += "</div></div>";

    h += '<div class="live"><p class="label">Résultat</p><div class="chips">' + (c.length || t.length ? "" : '<span class="chip none">Aucun allergène à déclarer</span>');
    c.forEach(function (x) { h += '<span class="chip">' + esc(A[x].fr) + "</span>"; });
    t.forEach(function (x) { h += '<span class="chip trace">Traces : ' + esc(A[x].fr) + "</span>"; });
    h += '</div><div class="meta"><span>Coût matière <span class="num">' + eur(cout(r)) + '</span></span><span class="pill ' + (over ? "bad" : "ok") + '">' + pct(rr) + '</span><span>Prix minimum pour tenir ' + state.cible + ' % : <span class="num">' + eur(conseille(r)) + "</span></span></div></div>";

    h += '<div class="row" style="justify-content:space-between"><button class="btn primary" data-act="save"' + (r.nom.trim() && r.lignes.length ? "" : " disabled") + ">Enregistrer la fiche</button>";
    if (!r._new) h += draftConfirmDelete ? '<span class="row"><button class="btn danger" data-act="del-yes">Oui, supprimer</button><button class="btn" data-act="del-no">Annuler</button></span>' : '<button class="btn danger" data-act="del">Supprimer</button>';
    h += "</div></div></div>";
    var root = document.getElementById("sheet-root");
    var active = document.activeElement && document.activeElement.id;
    var caret = null; try { caret = document.activeElement.selectionStart; } catch (e) {}
    root.innerHTML = h;
    if (active) { var el = document.getElementById(active); if (el) { el.focus(); try { if (caret != null && el.setSelectionRange && el.type === "text") el.setSelectionRange(caret, caret); } catch (e) {} } }
  }

  // ---------- Événements ----------
  document.querySelector(".tabs").addEventListener("click", function (e) {
    var b = e.target.closest(".tab"); if (!b) return;
    tab = b.dataset.tab; confirmReset = false; render(); window.scrollTo(0, 0);
  });
  document.getElementById("resto").addEventListener("input", function (e) { state.resto = e.target.value; save(); });

  document.getElementById("view").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.dataset.act;
    if (act === "new") openEditor(null);
    if (act === "edit") openEditor(b.dataset.id);
    if (act === "lang") { state.lang = b.dataset.lang; save(); render(); }
    if (act === "inv-apply") {
      var n = 0;
      pendingInvoice.forEach(function (p) { if (p.ok) { ing(p.id).prix = p.prix; n++; } });
      pendingInvoice = null; touch(); render(); toast(n + " prix mis à jour");
    }
    if (act === "inv-cancel") { pendingInvoice = null; render(); }
    if (act === "reset") { confirmReset = true; render(); }
    if (act === "reset-no") { confirmReset = false; render(); }
    if (act === "reset-yes") { state = SAMPLE(); confirmReset = false; pendingInvoice = null; save(); render(); toast("Données d'exemple rétablies"); }
  });

  document.getElementById("view").addEventListener("change", function (e) {
    var el = e.target;
    if (el.dataset.act === "pick") {
      var v = el.value, i = clientSel.indexOf(v);
      if (el.checked && i < 0) clientSel.push(v); if (!el.checked && i >= 0) clientSel.splice(i, 1);
      render(); var again = document.getElementById(el.id); if (again) again.focus();
    }
    if (el.dataset.act === "inv") { pendingInvoice[+el.dataset.i].ok = el.checked; }
    if (el.dataset.act === "prix") { var g = ing(el.dataset.id), p = parseFloat(el.value); if (g && p >= 0) { g.prix = p; touch(); render(); } }
    if (el.id === "cible") { var c = parseFloat(el.value); if (c > 0 && c < 100) { state.cible = c; save(); render(); } }
    if (el.id === "import-photo" && el.files && el.files.length) {
      var r = { id: "r" + Date.now(), nom: "Salade de chèvre chaud, miel et noisettes", noms: {}, prix: 14,
        lignes: [L("salade", 0.08), L("chevre", 0.08), L("pain", 0.04), L("miel", 0.01), L("noisettes", 0.015), L("huile_olive", 0.015), L("vinaigre", 0.005), L("moutarde", 0.003)],
        traces: [], tracesNote: "", variante: { fr: "Sans noisettes", en: "", de: "", it: "", retire: ["fruits_coque"] }, statut: "a_verifier" };
      state.recettes.unshift(r); touch(); render(); openEditor(r.id); toast("Recette pré-remplie : à vérifier");
    }
    if (el.id === "invoice-photo" && el.files && el.files.length) {
      pendingInvoice = [{ id: "saumon", prix: 32.00, ok: true }, { id: "beurre", prix: 12.80, ok: true }, { id: "creme", prix: 5.40, ok: true }];
      render();
    }
  });

  var sheetRoot = document.getElementById("sheet-root");
  sheetRoot.addEventListener("click", function (e) {
    if (!draft) return;
    if (e.target.dataset && e.target.dataset.act === "sheet-bg") { closeEditor(); return; }
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.dataset.act;
    if (act === "close") closeEditor();
    if (act === "del-line") { draft.lignes.splice(+b.dataset.i, 1); renderSheet(); }
    if (act === "scan") {
      if (!ing("pesto_bocal")) state.ingredients.push({ id: "pesto_bocal", nom: "Sauce pesto en bocal (exemple scanné)", unite: "kg", prix: 18.00, al: ["lait", "fruits_coque"], src: "Open Food Facts · à confirmer" });
      draft.lignes.push(L("pesto_bocal", 0.03)); save(); renderSheet(); toast("Produit scanné ajouté : allergènes à confirmer");
    }
    if (act === "save") {
      var clean = JSON.parse(JSON.stringify(draft)); delete clean._new; if (clean.statut === "a_verifier") clean.statut = "ok";
      clean.variante.retire = clean.variante.retire.filter(function (x) { return contient(clean).indexOf(x) >= 0; });
      clean.traces = clean.traces.filter(function (x) { return contient(clean).indexOf(x) < 0; });
      var i = -1; state.recettes.forEach(function (x, k) { if (x.id === clean.id) i = k; });
      if (i >= 0) state.recettes[i] = clean; else state.recettes.unshift(clean);
      touch(); closeEditor(); render(); toast("Fiche enregistrée");
    }
    if (act === "del") { draftConfirmDelete = true; renderSheet(); }
    if (act === "del-no") { draftConfirmDelete = false; renderSheet(); }
    if (act === "del-yes") { state.recettes = state.recettes.filter(function (x) { return x.id !== draft.id; }); touch(); closeEditor(); render(); toast("Recette supprimée"); }
  });
  sheetRoot.addEventListener("input", function (e) {
    if (!draft) return;
    var el = e.target, f = el.dataset.f;
    if (f === "nom") { draft.nom = el.value; var sb = sheetRoot.querySelector('[data-act="save"]'); if (sb) sb.disabled = !(draft.nom.trim() && draft.lignes.length); }
    if (f === "tracesNote") draft.tracesNote = el.value;
    if (f === "variante") draft.variante.fr = el.value;
  });
  sheetRoot.addEventListener("change", function (e) {
    if (!draft) return;
    var el = e.target;
    if (el.dataset.f === "prix") { draft.prix = Math.max(0, parseFloat(el.value) || 0); renderSheet(); }
    if (el.dataset.act === "q") {
      var l = draft.lignes[+el.dataset.i], g = ing(l.ing), v = Math.max(0, parseFloat(el.value) || 0);
      l.q = bigUnit(g.unite) ? v / 1000 : v; renderSheet();
    }
    if (el.id === "add-ing" && el.value) {
      var g2 = ing(el.value);
      draft.lignes.push(L(el.value, bigUnit(g2.unite) ? 0.05 : 1)); renderSheet();
      var last = document.getElementById("q-" + (draft.lignes.length - 1)); if (last) last.focus();
    }
    if (el.dataset.act === "trace") {
      var i = draft.traces.indexOf(el.value);
      if (el.checked && i < 0) draft.traces.push(el.value); if (!el.checked && i >= 0) draft.traces.splice(i, 1); renderSheet();
    }
    if (el.dataset.act === "vretire") {
      var j = draft.variante.retire.indexOf(el.value);
      if (el.checked && j < 0) draft.variante.retire.push(el.value); if (!el.checked && j >= 0) draft.variante.retire.splice(j, 1); renderSheet();
    }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && draft) closeEditor(); });

  render();
})();
</script>

</body>
</html>
