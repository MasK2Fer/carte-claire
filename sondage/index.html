<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sondage">
<title>Sondage Carte Claire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Mise en page : une question par écran, comme une fiche technique posée sur le passe ; colonne de 620 px, barre de progression en haut, boutons en bas */
:root {
  --bg: #F7F6F2;
  --surface: #FFFFFF;
  --sunk: #EFEDE6;
  --ink: #161615;
  --muted: #6B6960;
  --line: #E4E1D8;
  --accent: #7A5C00;
  --accent-soft: #FFF6D6;
  --accent-ink: #161615;
  --fill: #F2C94C;
  --warm: #B86A1B;
  --warm-soft: #FBEBD2;
  --shadow: 0 1px 2px rgba(22,22,21,.05), 0 6px 20px rgba(22,22,21,.06);
  --f-display: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-num: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 17px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2 { font-family: var(--f-display); font-weight: 800; margin: 0; text-wrap: balance; letter-spacing: .005em; }
p { margin: 0; }
.eyebrow { font: 600 13px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }

/* En-tête collant */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; flex-direction: column; gap: 10px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 700 15px/1 var(--f-display); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.brand svg { width: 20px; height: 20px; }
.count { font: 500 13px/1 var(--f-num); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--fill); border-radius: 99px; transition: width .35s ease; }

/* Accueil */
.hero { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.hero h1 { font-size: clamp(30px, 7vw, 44px); line-height: 1.05; letter-spacing: -.01em; }
.hero p { font-size: 18px; max-width: 34em; }
.ticket { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.ticket div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ticket b { font: 700 26px/1 var(--f-display); }
.ticket span { font-size: 14px; color: var(--muted); }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode { appearance: none; text-align: left; cursor: pointer; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 6px; font: inherit; transition: border-color .15s, transform .15s; }
.mode:hover { border-color: var(--accent); transform: translateY(-1px); }
.mode strong { font: 700 22px/1.05 var(--f-display); }
.mode .time { font: 500 13px/1 var(--f-num); color: var(--accent); }
.mode.main { background: var(--fill); color: var(--accent-ink); border-color: var(--fill); }
.mode.main .time { color: var(--accent-ink); opacity: .85; }
.gift { display: flex; gap: 12px; align-items: flex-start; background: var(--warm-soft); border-radius: 12px; padding: 14px 16px; font-size: 15px; }
.gift svg { flex: none; width: 22px; height: 22px; color: var(--warm); margin-top: 1px; }
.fine { font-size: 13px; color: var(--muted); }

/* Question */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 22px; display: flex; flex-direction: column; gap: 18px; }
.section { display: flex; align-items: center; gap: 10px; }
.section .chip { font: 600 12px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 6px 9px; border-radius: 6px; }
.card h2 { font-size: clamp(22px, 5vw, 28px); line-height: 1.15; letter-spacing: -.005em; }
.hint { font-size: 15px; color: var(--muted); margin-top: -8px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; background: var(--surface); transition: border-color .12s, background .12s; }
.opt:hover { border-color: var(--accent); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .mark { flex: none; width: 22px; height: 22px; border: 2px solid var(--line); display: grid; place-items: center; transition: all .12s; }
.opt.radio .mark { border-radius: 50%; }
.opt.check .mark { border-radius: 6px; }
.opt .mark svg { width: 14px; height: 14px; opacity: 0; color: var(--accent-ink); }
.opt.on { border-color: var(--fill); background: var(--accent-soft); }
.opt.on .mark { background: var(--fill); border-color: var(--fill); }
.opt.on .mark svg { opacity: 1; }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt .rank { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font: 700 15px/1 var(--f-display); }
.opt.on .rank { background: var(--fill); border-color: var(--fill); color: var(--accent-ink); }
.other { margin-top: 2px; }

/* Échelles */
.rows { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; padding-bottom: 0; }
.row-label { font-weight: 600; font-size: 16px; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale button { appearance: none; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 9px 0; font: 600 17px/1 var(--f-num); font-variant-numeric: tabular-nums; transition: all .12s; }
.scale button:hover { border-color: var(--accent); }
.scale button[aria-pressed="true"] { background: var(--fill); border-color: var(--fill); color: var(--accent-ink); }
.scale-ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

textarea, input[type=text], input[type=email] { width: 100%; font: inherit; color: var(--ink); background: var(--sunk); border: 1.5px solid transparent; border-radius: 12px; padding: 13px 14px; }
textarea { min-height: 120px; resize: vertical; }
textarea:focus, input[type=text]:focus, input[type=email]:focus { outline: none; border-color: var(--accent); background: var(--surface); }

/* Navigation */
.nav { display: flex; gap: 10px; align-items: center; }
.btn { appearance: none; cursor: pointer; border: 0; border-radius: 12px; padding: 14px 20px; font: 800 16px/1 var(--f-display); letter-spacing: .01em; }
.btn.primary { background: var(--fill); color: var(--accent-ink); flex: 1; }
.btn.ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .mode:focus-visible, .scale button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.skip { appearance: none; background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; padding: 4px; align-self: center; }

/* Fin */
.done { text-align: left; display: flex; flex-direction: column; gap: 14px; }
.done .seal { width: 64px; height: 64px; border-radius: 50%; background: var(--fill); color: var(--accent-ink); display: grid; place-items: center; }
.done .seal svg { width: 34px; height: 34px; }
.done h2 { font-size: 36px; }
.saved { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--sunk); color: var(--muted); }


/* Réponses de l'appareil */
.admin-link { appearance: none; background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; padding: 4px 0; align-self: flex-start; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stats div { background: var(--sunk); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.stats b { font: 800 28px/1 var(--f-num); font-variant-numeric: tabular-nums; }
.stats span { font-size: 14px; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.btn.danger { background: transparent; color: #B3261E; border: 1.5px solid #E9B8B3; }
.confirm { background: #FBE4E1; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
.confirm .nav { flex-wrap: wrap; }
.offline { font-size: 13px; color: var(--muted); }
.anim { animation: rise .28s ease both; }
@keyframes rise { from { transform: translateY(8px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .anim { animation: none; } .bar i, .mode { transition: none; } }
@media (max-width: 460px) {
  .modes { grid-template-columns: 1fr; }
  .card { padding: 18px; }
  .ticket b { font-size: 22px; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 3c-1.7 1.2-2.5 3.3-2.5 6.5V13H18V21"/></svg>
        Carte Claire
      </div>
      <span class="count" id="count"></span>
    </div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  </header>
  <main id="app"></main>
</div>

<script>
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const FULL = [

  { id:"couverts", s:"A", t:"single", q:"Combien de couverts servez-vous par jour en moyenne ?", o:["Moins de 30","30 à 80","80 à 150","Plus de 150"] },

  { id:"role", s:"A", t:"single", q:"Quel est votre rôle ?", o:["Propriétaire gérant","Chef de cuisine","Directeur ou manager"], other:true },
  { id:"nb_etab", s:"A", t:"single", q:"Combien d'établissements gérez-vous ?", o:["1","2 à 3","4 ou plus"] },

  { id:"calcul", s:"B", t:"single", q:"Comment calculez-vous le coût matière de vos plats ?", o:["Je ne le calcule pas","De tête, à l'expérience","Sur papier","Tableur Excel ou Google Sheets","Logiciel de caisse","Mon comptable s'en occupe"], other:"Logiciel spécialisé (lequel ?)" },
  { id:"ratio", s:"B", t:"single", q:"Connaissez-vous votre ratio coût matière du mois dernier ?", o:["Oui, précisément","À peu près","Non"] },
  { id:"temps", s:"B", t:"single", q:"Combien de temps par semaine passez-vous sur les fiches techniques, les prix fournisseurs et les marges ?", o:["Aucun","Moins d'1 heure","1 à 3 heures","Plus de 3 heures"] },
  { id:"allergenes", s:"B", t:"single", q:"Comment gérez-vous l'affichage des 14 allergènes obligatoires ?", o:["Classeur ou affiche papier","Tableur","Directement sur la carte","Le serveur demande en cuisine","Pas vraiment géré"] },
  { id:"outils", s:"B", t:"multi", q:"Quels outils numériques utilisez-vous déjà ?", h:"Plusieurs réponses possibles.", o:["Caisse (Zelty, Lightspeed, Tiller, L'Addition…)","Réservation (TheFork, Zenchef…)","Livraison (Uber Eats, Deliveroo…)","Commandes fournisseurs en ligne","Logiciel HACCP","Carte QR code","Aucun"] },

  { id:"pertes_argent", s:"C", t:"rank", max:3, q:"Qu'est-ce qui vous fait perdre le plus d'argent ?", h:"Touchez vos 3 premiers, dans l'ordre.", o:["Hausse des prix fournisseurs non répercutée","Gaspillage et pertes","Portions irrégulières","Plats vendus sous leur coût sans le savoir","Vol ou casse","Mauvaises commandes (trop ou pas assez)","Erreurs de facturation fournisseur"] },
  { id:"corvees", s:"C", t:"scale", q:"À quel point ces tâches vous pèsent-elles ?", ends:["Pas du tout","Énormément"], o:["Mettre à jour les prix des ingrédients","Faire les fiches techniques","Tenir le tableau des allergènes","Faire l'inventaire","Passer les commandes","Fixer les prix de vente","Traduire la carte"] },
  { id:"incident", s:"C", t:"single", q:"Avez-vous déjà eu un problème avec un client allergique ou lors d'un contrôle DDPP ?", o:["Oui","Non","Je préfère ne pas répondre"] },
  { id:"baguette", s:"C", t:"text", q:"Avec une baguette magique, que changeriez-vous en premier dans votre gestion ?", ph:"Ex. : ne plus recopier les factures le dimanche soir" },

  { id:"fonctions", s:"D", t:"scale", q:"Quelle utilité auraient ces fonctions pour vous ?", ends:["Inutile","Indispensable"], o:["Coût matière et marge de chaque plat calculés automatiquement","Alerte quand un plat passe sous la marge visée","Lecture automatique des factures fournisseurs (photo)","Prix des ingrédients mis à jour depuis les factures","Tableau des 14 allergènes généré depuis les recettes","Carte client QR code, traduite, filtrable par allergie","Suggestion de prix de vente selon la marge souhaitée","Inventaire rapide au téléphone","Bon de commande généré selon les ventes prévues","Suivi du gaspillage et des pertes","Analyse de la carte : plats rentables, plats à retirer","Lien avec ma caisse pour connaître les ventes réelles","Fiches recettes avec photos pour former l'équipe","Plusieurs utilisateurs avec des droits différents","Comparaison des prix entre fournisseurs","Plats du jour calculés à partir des invendus"] },
  { id:"killer", s:"D", t:"text", q:"Quelle est LA fonction qui vous ferait installer l'application demain ?", ph:"Une phrase suffit" },

  { id:"moment", s:"D", t:"multi", q:"À quel moment de la journée l'ouvririez-vous ?", h:"Plusieurs réponses possibles.", o:["À la réception des livraisons","Pendant la mise en place","Après le service","Le soir ou le week-end","Une fois par mois pour le bilan"] },
  { id:"abandon", s:"D", t:"multi", q:"Qu'est-ce qui vous ferait abandonner une application de ce type ?", h:"Plusieurs réponses possibles.", o:["Trop longue à remplir au départ","Trop compliquée pour mon équipe","Trop chère","Ne marche pas sans internet","Ne parle pas à ma caisse","Pas de support en français","Peur pour mes données"] },
  { id:"installation", s:"D", t:"single", q:"Combien de temps accepteriez-vous de passer pour tout mettre en place la première fois ?", o:["Moins d'1 heure","Une demi-journée","Une journée","Je voudrais qu'on le fasse pour moi"] },

  { id:"prix", s:"E", t:"single", q:"Combien paieriez-vous par mois pour une appli qui fait gagner 2 points de coût matière ?", h:"Sur 20 000 € d'achats mensuels, 2 points représentent environ 400 € par mois.", o:["Rien, seulement si c'est gratuit","Moins de 20 €","20 à 40 €","40 à 80 €","Plus de 80 €"] },
  { id:"formule", s:"E", t:"single", q:"Quelle formule préférez-vous ?", o:["Abonnement mensuel sans engagement","Abonnement annuel moins cher","Paiement unique","Gratuit avec options payantes"] },
  { id:"decideurs", s:"E", t:"multi", q:"Qui d'autre doit dire oui avant d'adopter un nouvel outil ?", o:["Personne","Mon associé","Mon chef","Mon comptable","Le siège ou la franchise"] },

  { id:"tva", s:"F", t:"single", q:"Vendez-vous à emporter ou en livraison, avec des taux de TVA différents ?", h:"5,5 %, 10 % ou 20 % selon le produit et le mode de vente.", o:["Oui, souvent","Parfois","Non","Je ne sais pas"] },
  { id:"pertes", s:"F", t:"single", q:"Comptez-vous les pertes (épluchage, parage, cuisson) dans le coût de vos plats ?", o:["Oui, avec un pourcentage par produit","À peu près","Non"] },
  { id:"portions", s:"F", t:"single", q:"Vos portions sont-elles pesées ?", o:["Toujours","Pour certains plats","Jamais"] },
  { id:"plat_jour", s:"F", t:"single", q:"Combien de temps vous prend un nouveau plat du jour (prix, allergènes, affichage) ?", o:["Moins de 5 minutes","5 à 15 minutes","Plus de 15 minutes","Je n'en fais pas"] },
  { id:"epuise", s:"F", t:"single", q:"Comment prévenez-vous les clients qu'un plat est épuisé ?", o:["Le serveur le dit","Sur l'ardoise","Je le retire de la carte en ligne","On ne prévient pas"] },
  { id:"alerte", s:"F", t:"multi", q:"L'appli vous dit : « la hausse du beurre vous coûte 85 € par mois sur 4 plats ». Que faites-vous ?", h:"Plusieurs réponses possibles.", o:["J'augmente le prix de vente","Je change de fournisseur","Je modifie la recette","Rien, mais je veux le savoir","Ça ne m'intéresse pas"] },

  { id:"oubli", s:"G", t:"text", q:"Y a-t-il quelque chose qu'on n'a pas demandé et qui vous semble important ?", ph:"Facultatif" },

const FLASH = [
  { id:"type", s:"A", t:"single", q:"Vous êtes :", o:["Restaurant","Bistrot ou brasserie","Restauration rapide","Traiteur"], other:true },
  { id:"ratio_plat", s:"B", t:"single", q:"Connaissez-vous le coût matière de chacun de vos plats ?", o:["Oui","À peu près","Non"] },
  { id:"casse_tete", s:"C", t:"single", q:"Votre plus gros casse-tête de gestion ?", o:["Les prix fournisseurs","Les allergènes","L'inventaire","Les commandes","Le gaspillage","Les prix de vente"] },
  { id:"utilite", s:"D", t:"scale", q:"Une appli qui calcule vos marges et vos allergènes à partir d'une photo de facture vous servirait-elle ?", ends:["Pas du tout","Tous les jours"], o:["Votre note"] },
  { id:"prix", s:"E", t:"single", q:"Combien paieriez-vous par mois ?", o:["0 €","Moins de 20 €","20 à 40 €","Plus de 40 €"] },

];

let mode = null, Q = [], i = 0, A = {}, savedNote = "";
const app = document.getElementById("app");
const bar = document.getElementById("bar");
const count = document.getElementById("count");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function progress() {
  if (!mode) { bar.style.width = "0"; count.textContent = ""; return; }
  const n = Q.length, k = Math.min(i, n);
  bar.style.width = (k / n * 100) + "%";
  count.textContent = i < n ? `${String(i + 1).padStart(2, "0")} / ${n}` : `${n} / ${n}`;
}

function home() {
  mode = null; progress();
  app.innerHTML = `

    </div>
    <div class="gift">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-2-3-6-3-6-1s3 1 6 1zm0 0c2-3 6-3 6-1s-3 1-6 1z"/></svg>
      <span><b>3 mois offerts</b> à la sortie de l'appli si vous laissez un contact à la fin.</span>
    </div>
    <p class="fine">Anonyme si vous le souhaitez. Vos réponses servent uniquement à concevoir Carte Claire.</p>
    <button class="admin-link" id="go-admin" type="button">Réponses enregistrées sur cet appareil (${loadAll().length})</button>
  </section>`;
  document.getElementById("go-full").onclick = () => start("complet");
  document.getElementById("go-flash").onclick = () => start("flash");
  document.getElementById("go-admin").onclick = () => admin(false);
}

function start(m) { mode = m; Q = m === "complet" ? FULL : FLASH; i = 0; A = {}; render(); }

function answered(q) {
  const a = A[q.id];
  if (q.t === "single") return !!(a && (a.v && (a.v !== "__other" || (a.other || "").trim())));
  if (q.t === "multi" || q.t === "rank") return !!(a && a.length);
  if (q.t === "scale") return !!(a && Object.keys(a).length);
  if (q.t === "contact") return !!(a && a.v);
  return !!(a && a.trim());
}

function render() {
  progress();
  if (i >= Q.length) return finish();
  const q = Q[i];
  let body = "";
  if (q.t === "single" || q.t === "contact") {
    const a = A[q.id] || {};
    const opts = [...q.o];
    body = `<div class="opts" role="radiogroup" aria-label="${esc(q.q)}">` + opts.map((o, k) =>
      `<label class="opt radio ${a.v === o ? "on" : ""}"><input type="radio" name="r" value="${esc(o)}" ${a.v === o ? "checked" : ""}><span class="mark">${CHECK}</span><span>${esc(o)}</span></label>`).join("");
    if (q.other) {
      const lbl = typeof q.other === "string" ? q.other : "Autre";
      body += `<label class="opt radio ${a.v === "__other" ? "on" : ""}"><input type="radio" name="r" value="__other" ${a.v === "__other" ? "checked" : ""}><span class="mark">${CHECK}</span><span>${esc(lbl)}</span></label>`;
      body += `<input type="text" class="other" id="other-${q.id}" placeholder="Précisez" value="${esc(a.other || "")}" ${a.v === "__other" ? "" : "hidden"}>`;
    }
    body += `</div>`;
    if (q.t === "contact") body += `<input type="text" id="contact-${q.id}" placeholder="E-mail ou téléphone (facultatif)" value="${esc(a.contact || "")}" autocomplete="email">`;
  } else if (q.t === "multi") {
    const a = A[q.id] || [];
    body = `<div class="opts">` + q.o.map(o =>
      `<label class="opt check ${a.includes(o) ? "on" : ""}"><input type="checkbox" value="${esc(o)}" ${a.includes(o) ? "checked" : ""}><span class="mark">${CHECK}</span><span>${esc(o)}</span></label>`).join("") + `</div>`;
  } else if (q.t === "rank") {
    const a = A[q.id] || [];
    body = `<div class="opts">` + q.o.map(o => {
      const r = a.indexOf(o);
      return `<label class="opt ${r >= 0 ? "on" : ""}"><input type="checkbox" value="${esc(o)}" ${r >= 0 ? "checked" : ""}><span class="rank">${r >= 0 ? r + 1 : ""}</span><span>${esc(o)}</span></label>`;
    }).join("") + `</div>`;
  } else if (q.t === "scale") {
    const a = A[q.id] || {};
    body = `<div class="rows">` + q.o.map((o, k) => `
      <div class="row">
        ${q.o.length > 1 ? `<span class="row-label">${esc(o)}</span>` : ""}
        <div class="scale" role="group" aria-label="${esc(o)}">${[1,2,3,4,5].map(n => `<button type="button" data-row="${k}" data-n="${n}" aria-pressed="${a[o] === n}">${n}</button>`).join("")}</div>
        <div class="scale-ends"><span>${esc(q.ends[0])}</span><span>${esc(q.ends[1])}</span></div>
      </div>`).join("") + `</div>`;
  } else {
    body = `<textarea id="text-${q.id}" placeholder="${esc(q.ph || "")}">${esc(A[q.id] || "")}</textarea>`;
  }
  const last = i === Q.length - 1;
  const optional = q.t === "text" || q.t === "scale" || q.t === "multi" || q.t === "rank";
  app.innerHTML = `
  <section class="card anim" aria-live="polite">
    <div class="section"><span class="chip">${esc(S[q.s])}</span></div>
    <h2>${esc(q.q)}</h2>
    ${q.h ? `<p class="hint">${esc(q.h)}</p>` : ""}
    ${body}
    <div class="nav">
      <button class="btn ghost" id="prev" type="button">${i === 0 ? "Accueil" : "Retour"}</button>
      <button class="btn primary" id="next" type="button">${last ? "Envoyer" : "Suivant"}</button>
    </div>
    ${optional && !last ? `<button class="skip" id="skip" type="button">Passer cette question</button>` : ""}
  </section>`;
  wire(q);
}

function refreshNext(q) {
  const nb = document.getElementById("next");
  const optional = q.t === "text" || q.t === "scale" || q.t === "multi" || q.t === "rank";
  nb.disabled = !optional && !answered(q);
}

function wire(q) {
  const card = app.querySelector(".card");
  if (q.t === "single" || q.t === "contact") {
    card.querySelectorAll('input[type=radio]').forEach(inp => inp.onchange = () => {
      const a = A[q.id] || {}; a.v = inp.value; A[q.id] = a;
      card.querySelectorAll(".opt").forEach(l => l.classList.toggle("on", l.querySelector("input").checked));
      const ot = document.getElementById("other-" + q.id);
      if (ot) { ot.hidden = a.v !== "__other"; if (!ot.hidden) ot.focus(); }
      refreshNext(q);
      if (q.t === "single" && a.v !== "__other") setTimeout(() => { if (Q[i] === q) { i++; render(); } }, 260);
    });
    const ot = document.getElementById("other-" + q.id);
    if (ot) ot.oninput = () => { A[q.id] = { ...(A[q.id] || {}), other: ot.value }; refreshNext(q); };
    const ct = document.getElementById("contact-" + q.id);
    if (ct) ct.oninput = () => { A[q.id] = { ...(A[q.id] || {}), contact: ct.value }; };
  } else if (q.t === "multi") {
    card.querySelectorAll('input[type=checkbox]').forEach(inp => inp.onchange = () => {
      A[q.id] = [...card.querySelectorAll("input:checked")].map(x => x.value);
      inp.closest(".opt").classList.toggle("on", inp.checked);
    });
  } else if (q.t === "rank") {
    card.querySelectorAll('input[type=checkbox]').forEach(inp => inp.onchange = () => {
      let a = A[q.id] || [];
      if (inp.checked) { if (a.length >= q.max) { inp.checked = false; return; } a.push(inp.value); }
      else a = a.filter(x => x !== inp.value);
      A[q.id] = a;
      card.querySelectorAll(".opt").forEach(l => {
        const v = l.querySelector("input").value, r = a.indexOf(v);
        l.classList.toggle("on", r >= 0); l.querySelector(".rank").textContent = r >= 0 ? r + 1 : "";
      });
    });
  } else if (q.t === "scale") {
    card.querySelectorAll(".scale button").forEach(b => b.onclick = () => {
      const o = q.o[+b.dataset.row], a = A[q.id] || {}; a[o] = +b.dataset.n; A[q.id] = a;
      b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    });
  } else {
    const ta = document.getElementById("text-" + q.id);
    ta.oninput = () => { A[q.id] = ta.value; };
  }
  document.getElementById("prev").onclick = () => { if (i === 0) home(); else { i--; render(); } };
  document.getElementById("next").onclick = () => { i++; render(); };
  const sk = document.getElementById("skip");
  if (sk) sk.onclick = () => { delete A[q.id]; i++; render(); };
  refreshNext(q);
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

// Adresse du Google Sheet qui reçoit les réponses (voir sondage/LISEZMOI.md). Vide : réponses gardées sur l'appareil seulement.
const ENDPOINT = "";
const KEY = "carte-claire-sondage-reponses";

function loadAll() { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; } }
function storeAll(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); return true; } catch (e) { return false; } }

async function send(r) {
  if (!ENDPOINT) return false;
  try {
    await fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(flat(r)) });
    return true;
  } catch (e) { return false; }
}

async function flush() {
  if (!ENDPOINT || !navigator.onLine) return;
  const list = loadAll(); let changed = false;
  for (const r of list) if (!r.envoye && await send(r)) { r.envoye = true; changed = true; }
  if (changed) storeAll(list);
}

async function save() {
  const r = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), mode, envoye_le: new Date().toISOString(), reponses: JSON.parse(JSON.stringify(A)), envoye: false };
  const list = loadAll(); list.push(r);
  const kept = storeAll(list);
  if (ENDPOINT && await send(r)) { r.envoye = true; storeAll(list); return "Réponses envoyées."; }
  if (!kept) return "Réponses non enregistrées : ce navigateur bloque le stockage (navigation privée ?).";
  return ENDPOINT ? "Réponses gardées sur cet appareil, elles partiront dès que la connexion revient." : "Réponses enregistrées sur cet appareil.";
}

const ALLQ = (() => { const m = new Map(); [...FULL, ...FLASH].forEach(q => { if (!m.has(q.id)) m.set(q.id, q); }); return [...m.values()]; })();
function val(q, a) {
  if (a == null) return "";
  if (q.t === "single" || q.t === "contact") return a.v === "__other" ? "Autre : " + (a.other || "") : (a.v || "");
  if (q.t === "multi" || q.t === "rank") return a.join(" | ");
  if (q.t === "scale") return Object.entries(a).map(([k, n]) => (q.o.length > 1 ? k + " = " : "") + n).join(" | ");
  return a;
}
function flat(r) {
  const o = { date: r.envoye_le, version: r.mode };
  ALLQ.forEach(q => { o[q.id] = val(q, r.reponses[q.id]); if (q.t === "contact") o.coordonnees = (r.reponses[q.id] || {}).contact || ""; });
  return o;
}
function csv(list) {
  const rows = list.map(flat); const cols = ["date", "version", ...ALLQ.map(q => q.id), "coordonnees"];
  const cell = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  return "\ufeff" + [cols.join(";"), ...rows.map(o => cols.map(c => cell(o[c])).join(";"))].join("\r\n");
}

function admin(confirming) {
  mode = null; progress();
  const list = loadAll(), pending = list.filter(r => !r.envoye).length;
  app.innerHTML = `
  <section class="card anim">
    <div class="section"><span class="chip">Sur cet appareil</span></div>
    <h2>Réponses enregistrées</h2>
    <div class="stats">
      <div><b>${list.length}</b><span>réponses au total</span></div>
      <div><b>${list.filter(r => r.mode === "complet").length}</b><span>questionnaires complets</span></div>
    </div>
    <p class="hint">${ENDPOINT ? (pending ? pending + " réponse(s) pas encore envoyée(s) au tableau Google." : "Toutes les réponses sont dans le tableau Google.") : "Elles restent sur ce téléphone ou cette tablette. Téléchargez le fichier pour les ouvrir dans Excel ou Google Sheets."}</p>
    <div class="stack">
      <button class="btn primary" id="dl" type="button" ${list.length ? "" : "disabled"}>Télécharger le fichier Excel (CSV)</button>
      <button class="btn ghost" id="cp" type="button" ${list.length ? "" : "disabled"}>Copier les réponses</button>
      ${confirming ? `<div class="confirm"><span>Effacer les ${list.length} réponses de cet appareil ? Téléchargez-les d'abord : on ne pourra pas les récupérer.</span><div class="nav"><button class="btn danger" id="wipe-yes" type="button">Oui, effacer</button><button class="btn ghost" id="wipe-no" type="button">Annuler</button></div></div>`
        : `<button class="btn danger" id="wipe" type="button" ${list.length ? "" : "disabled"}>Effacer les réponses de cet appareil</button>`}
    </div>
    <p class="hint" id="msg" aria-live="polite"></p>
    <div class="nav"><button class="btn ghost" id="back" type="button">Retour au sondage</button></div>
  </section>`;
  const msg = document.getElementById("msg");
  document.getElementById("back").onclick = home;
  document.getElementById("dl").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv(list)], { type: "text/csv;charset=utf-8" }));
    a.download = "sondage-carte-claire-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    msg.textContent = "Fichier téléchargé.";
  };
  document.getElementById("cp").onclick = async () => {
    try { await navigator.clipboard.writeText(csv(list).slice(1)); msg.textContent = "Copié : collez-le dans un e-mail ou un tableur."; }
    catch (e) { msg.textContent = "La copie est bloquée ici : utilisez plutôt le téléchargement."; }
  };
  const w = document.getElementById("wipe"); if (w) w.onclick = () => admin(true);
  const y = document.getElementById("wipe-yes"); if (y) y.onclick = () => { storeAll([]); admin(false); document.getElementById("msg").textContent = "Réponses effacées."; };
  const n = document.getElementById("wipe-no"); if (n) n.onclick = () => admin(false);
}

async function finish() {
  progress();
  app.innerHTML = `
  <section class="card done anim">
    <div class="seal">${CHECK}</div>
    <h2>Merci, c'est noté</h2>
    <p>Vos réponses nous aident à choisir ce qu'on construit en premier. Si vous avez laissé un contact, on vous écrit dès que la maquette est prête à tester.</p>
    <p class="saved" id="saved">Enregistrement…</p>
    <div class="nav"><button class="btn ghost" id="again" type="button">Nouvelle réponse</button></div>
  </section>`;
  document.getElementById("again").onclick = home;
  document.getElementById("saved").textContent = await save();
}

home();
flush();
window.addEventListener("online", flush);
</script>
</body>
</html>
